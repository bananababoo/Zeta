[package]
name = "zeta_server"
description = "Headless authoritative Zeta server."
# `cargo run -p zeta_server` starts the game server, not the smoke test binaries.
default-run = "zeta_server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
zeta_core = { workspace = true, features = ["bevy"] }
bevy_app.workspace = true
bevy_ecs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
sqlx.workspace = true
bevy_replicon = { workspace = true, features = ["server"] }
bevy_state.workspace = true
bevy_time.workspace = true
getrandom.workspace = true

[lints]
workspace = true
