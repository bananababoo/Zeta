[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Every dependency states why it is worth its maintenance cost (see docs/architecture/code_style.md).
[workspace.dependencies]
zeta_core = { path = "crates/zeta_core" }
# Serialization for the Event Log, the network, and AI DM JSON. The de facto Rust standard.
serde = { version = "1", features = ["derive"] }
# JSON parsing and output for AI DM requests and responses.
serde_json = "1"
# Typed error enums with Display messages, without hand-written boilerplate.
thiserror = "2"

# Server only. zeta_core never depends on these (see docs/architecture/code_style.md Section 3).
# Async runtime that reqwest runs on, and that Bevy-to-network bridging will use.
tokio = { version = "1", features = ["rt"] }
# HTTP client for AI provider calls. The most used Rust HTTP client, built on tokio and rustls.
reqwest = { version = "0.13", features = ["json"] }
# Loads a local .env file so developers keep keys out of the repository and their shell.
dotenvy = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Panics in non-test code are bugs; use `?` or `expect` with the broken invariant as the message.
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
