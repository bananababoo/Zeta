[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Every dependency states why it is worth its maintenance cost (see docs/architecture/code_style.md).
[workspace.dependencies]
zeta_core = { path = "crates/zeta_core" }
# Serialization for the Event Log, the network, and AI DM JSON. The de facto Rust standard.
serde = { version = "1", features = ["derive"] }
# JSON parsing and output for AI DM requests and responses.
serde_json = "1"
# Typed error enums with Display messages, without hand-written boilerplate.
thiserror = "2"
# ECS components, resources, and systems without windowing or rendering (optional in zeta_core).
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }

# Server only. zeta_core never depends on these (see docs/architecture/code_style.md Section 3).
# Headless schedule and plugin runner for the authoritative server.
bevy_app = { version = "0.20", default-features = false, features = ["std"] }
# Async runtime for HTTP calls, PostgreSQL queries, and Bevy-to-tokio bridging.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
# HTTP client for AI provider calls. The most used Rust HTTP client, built on tokio and rustls.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Async PostgreSQL client, connection pool, and versioned migration runner.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "migrate", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Panics in non-test code are bugs; use `?` or `expect` with the broken invariant as the message.
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
