[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Every dependency states why it is worth its maintenance cost (see docs/architecture/code_style.md).
[workspace.dependencies]
zeta_core = { path = "crates/zeta_core" }
# Serialization for the Event Log, the network, and AI DM JSON. The de facto Rust standard.
serde = { version = "1", features = ["derive"] }
# JSON parsing and output for AI DM requests and responses.
serde_json = "1"
# Typed error enums with Display messages, without hand-written boilerplate.
thiserror = "2"
# ECS components, resources, and systems without windowing or rendering (optional in zeta_core).
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
# Server and client. Server-authoritative ECS replication chosen in docs/architecture/technical_architecture.md
# Section 1. Quarantined in zeta_server::net and zeta_client::net; each crate enables only its own side.
bevy_replicon = { version = "0.45", default-features = false }

# Server only. zeta_core never depends on these (see docs/architecture/code_style.md Section 3).
# Headless schedule and plugin runner for the authoritative server.
bevy_app = { version = "0.20", default-features = false, features = ["std"] }
# Async runtime for HTTP calls, PostgreSQL queries, and Bevy-to-tokio bridging.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
# HTTP client for AI provider calls. The most used Rust HTTP client, built on tokio and rustls.
# `rustls-no-provider` plus the `rustls` entry below select the `ring` crypto provider instead
# of `aws-lc-rs`, whose C library is one of the slowest crates to compile.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# TLS for reqwest and sqlx, with `ring` as its crypto provider. Installed in `GeminiProvider::new`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Async PostgreSQL client, connection pool, and versioned migration runner.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "json"] }
# Bevy states; bevy_replicon reports server connection status as a state.
bevy_state = { version = "0.20", default-features = false, features = ["std", "bevy_app"] }
# Frame time for the headless schedule, read by bevy_replicon's tick.
bevy_time = { version = "0.20", default-features = false, features = ["std"] }
# Operating-system randomness for fair, unpredictable d20 rolls. Already in Cargo.lock through reqwest.
# Pre-1.0: quarantined in zeta_server::dice.
getrandom = "0.4"

# Client only. Window, input, 2D sprites, text, and UI. Only the 2D and UI subsystems are enabled.
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    # PNG encoding for `save_to_disk` in the `ui_shot` screenshot tool, and PNG decoding for sprites.
    "png",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Panics in non-test code are bugs; use `?` or `expect` with the broken invariant as the message.
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"

# Debug builds optimize dependencies (Bevy, wgpu, replicon) but not Zeta's own crates: the
# debug client stays smooth and light on CPU, while our crates keep fast rebuilds and full
# debug info. Dependencies rebuild only when Cargo.lock changes.
[profile.dev.package."*"]
opt-level = 2
